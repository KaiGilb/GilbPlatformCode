name: units

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scripts' tests
        run: node --experimental-transform-types --no-warnings --import ./scripts/lib/ts-resolve.mjs --test "scripts/**/*.test.mjs"
      - name: Proofs of the units this change touches (pull request)
        if: github.event_name == 'pull_request'
        run: node scripts/proof.mjs --changed origin/${{ github.base_ref }} --with-dependents
      - name: Proofs of the units this change touches (push)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "new branch (before is all zeros): no proofs run"
          else
            node scripts/proof.mjs --changed "$BEFORE" --with-dependents
          fi
      - name: Taking apps
        run: |
          for app in apps/*/; do
            (cd "$app" && npm ci && npm run typecheck && npm test && npm run build)
          done

  apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A new app adds its folder name (under apps/) to this list.
        app: [records-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
        working-directory: apps/${{ matrix.app }}
      - name: Test
        run: npm test
        working-directory: apps/${{ matrix.app }}
      - name: Build
        run: npm run build
        working-directory: apps/${{ matrix.app }}
